<html lang="ja">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="稼働実績">

<title>通信稼働 実績ダッシュボード</title>
<style>
  :root{
    --red:#E4162F; --red-d:#B00E22; --red-l:#FF5A6E;
    --gold:#E0A526; --gold-d:#B9821A; --gold-l:#FFD36B;
    --ink:#241a14; --ink2:#6b5b50; --muted:#9a8a7d;
    --surface:#ffffff; --track:#f3ece2; --border:rgba(70,40,20,0.12);
    --good:#0f8f2f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{background:
     radial-gradient(1200px 380px at 100% -8%, rgba(224,165,38,.20), transparent 60%),
     radial-gradient(1000px 420px at -6% 0%, rgba(228,22,47,.14), transparent 55%),
     linear-gradient(160deg,#fffaf3 0%, #fff4ef 55%, #fdf7ee 100%);
     background-attachment:fixed;min-height:100vh}
  .wrap{max-width:1220px;margin:0 auto;padding:0 16px 60px}
  header.top{margin:0 -16px 18px;padding:20px 22px;color:#fff;
    background:linear-gradient(100deg,var(--red-d) 0%, var(--red) 42%, var(--gold-d) 100%);
    box-shadow:0 6px 22px rgba(180,20,40,.28)}
  header.top h1{margin:0;font-size:21px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
  header.top .spark{display:inline-block;width:12px;height:22px;background:var(--gold-l);border-radius:3px;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
  header.top .sub{margin:4px 0 0;font-size:12.5px;opacity:.92}
  .app{display:grid;grid-template-columns:238px minmax(0,1fr);gap:18px}
  .app>*{min-width:0}
  main{min-width:0}
  @media(max-width:840px){.app{grid-template-columns:minmax(0,1fr)}}
  aside.nav{align-self:start;position:sticky;top:12px}
  @media(max-width:840px){aside.nav{position:static}}
  .navcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:0 4px 16px rgba(120,70,30,.07)}
  .nav-h{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin:6px 6px 8px}
  .navbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);
    padding:9px 11px;border-radius:10px;font-size:13.5px;cursor:pointer;font-weight:600;margin-bottom:2px}
  .navbtn:hover{background:var(--track)}
  .navbtn.active{background:linear-gradient(90deg,var(--red) 0%,var(--gold) 160%);color:#fff;box-shadow:0 3px 10px rgba(200,30,50,.28)}
  .navbtn .av{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--gold),var(--red))}
  .navbtn.active .av{background:rgba(255,255,255,.25)}
  .navbtn.company .av{background:linear-gradient(135deg,var(--red),var(--red-d))}
  .search{width:100%;border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:12.5px;margin:2px 0 8px;background:var(--track)}
  .plist{max-height:52vh;overflow:auto}
  @media(max-width:840px){.plist{max-height:none;display:flex;flex-wrap:wrap;gap:6px}
    .plist .navbtn{width:auto}}

  section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px rgba(120,70,30,.06)}
  .sec-h{font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--red-d);text-transform:uppercase;margin:0 0 3px}
  .sec-note{font-size:12.5px;color:var(--ink2);margin:0 0 14px;line-height:1.55}
  .pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:4px}
  .pagetitle{font-size:19px;font-weight:800;display:flex;align-items:center;gap:11px}
  .pagetitle .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;background:linear-gradient(135deg,var(--gold),var(--red));box-shadow:0 3px 10px rgba(200,30,50,.25)}
  .tabs{display:inline-flex;background:var(--track);border-radius:11px;padding:3px}
  .tab{border:0;background:transparent;color:var(--ink2);padding:7px 15px;border-radius:9px;font-size:13px;cursor:pointer;font-weight:700}
  .tab.active{background:linear-gradient(90deg,var(--red),var(--gold) 170%);color:#fff;box-shadow:0 2px 7px rgba(200,30,50,.25)}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:720px){.cards{grid-template-columns:1fr}}
  .card{border:1px solid var(--border);border-radius:13px;padding:15px 16px;background:linear-gradient(180deg,#fff, #fffdf8);position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
  .card.c-shisha::before{background:var(--red)} .card.c-agency::before{background:var(--gold)} .card.c-total::before{background:linear-gradient(var(--red),var(--gold))}
  .card .lab{font-size:13px;font-weight:800;color:var(--ink)}
  .big{font-size:31px;font-weight:800;margin:8px 0 2px;font-variant-numeric:tabular-nums;color:var(--red-d)}
  .card.c-agency .big{color:var(--gold-d)}
  .big .u{font-size:13px;font-weight:700;color:var(--ink2);margin-left:5px}
  .mini{display:flex;gap:15px;margin-top:10px;flex-wrap:wrap}
  .mini div{font-size:11.5px;color:var(--ink2)}
  .mini b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:1px}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{border:1px solid var(--border);border-radius:12px;padding:13px 14px;background:linear-gradient(180deg,#fff,#fffdf8)}
  .stat .l{font-size:11.5px;color:var(--ink2);font-weight:700}
  .stat .v{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px;color:var(--red-d)}
  .stat .v.gold{color:var(--gold-d)}
  .stat .s{font-size:11px;color:var(--muted);margin-top:2px}

  .selrow{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .pill{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:999px;padding:5px 14px;font-size:12.5px;cursor:pointer;font-weight:700}
  .pill.active{background:var(--red);border-color:var(--red);color:#fff}

  .barrow{display:flex;align-items:center;gap:10px;margin:7px 0}
  .barrow .nm{width:132px;font-size:12.5px;color:var(--ink2);flex:none}
  .bartrack{flex:1;height:20px;background:var(--track);border-radius:6px;overflow:hidden}
  .barfill{height:100%;border-radius:6px 5px 5px 6px;background:linear-gradient(90deg,var(--gold),var(--red))}
  .barfill.red{background:linear-gradient(90deg,var(--red-d),var(--red))}
  .barfill.gold{background:linear-gradient(90deg,var(--gold-d),var(--gold))}
  .barval{width:50px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;flex:none;font-weight:700}
  .barsub{width:64px;text-align:right;font-size:11px;color:var(--muted);flex:none}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
  .grid2>*{min-width:0}
  @media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
  .insight{background:linear-gradient(180deg,#fffdf7,#fff6ee);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:9px;padding:11px 13px;font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.6}
  .insight b{color:var(--red-d)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 9px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--track)}
  th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
  thead th{color:var(--red-d);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;user-select:none;white-space:nowrap}
  tbody tr:hover{background:var(--track)}
  tbody tr.me{background:#fff2e0}
  .trend{display:flex;gap:14px;align-items:flex-end;height:150px;padding:6px 4px 0}
  .tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .tbar{width:56%;max-width:54px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--red),var(--gold));min-height:3px}
  .tcol .tv{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
  .tcol .tm{font-size:11.5px;color:var(--ink2);font-weight:700}
  .foot{color:var(--muted);font-size:11.5px;margin-top:8px;text-align:center;line-height:1.8}
  .empty{color:var(--muted);font-size:13px;padding:10px 0}
</style>
</head>

</div>

function aggPerson(name, months, cat){

  ITEM_KEYS.forEach(k=>acc.items[k]={件数:0,ポイント:0});CARRIERS.forEach(c=>acc.carriers[c]=0);AGES.forEach(a=>acc.ages[a]=0);
  months.forEach(m=>{const b=pbucket(m,name,cat);if(!b)return;
    acc.稼働数+=b.稼働数;acc.総ポイント+=b.総ポイント;acc.着座+=b.着座;acc.成約+=b.成約;
    ITEM_KEYS.forEach(k=>{acc.items[k].件数+=b.items[k].件数;acc.items[k].ポイント+=b.items[k].ポイント;});
    CARRIERS.forEach(c=>acc.carriers[c]+=b.carriers[c]);AGES.forEach(a=>acc.ages[a]+=b.ages[a]);});
  const n=acc.稼働数||0;
  acc.総合生産性=n?acc.総ポイント/n:0;acc.着座生産性=n?acc.着座/n:0;acc.成約生産性=n?acc.成約/n:0;
  ITEM_KEYS.forEach(k=>acc.items[k].生産性=n?acc.items[k].ポイント/n:0);
  return acc;
}

function distHTML(b,keys,labelMap,accessor,unit,cls){
  const vals=keys.map(k=>accessor(b,k));const total=vals.reduce((a,c)=>a+c,0)||1;const max=Math.max(...vals,1);
  let h='';keys.forEach((k,i)=>{const v=vals[i];
    h+=`<div class="barrow"><div class="nm">${labelMap[k]||k}</div>
      <div class="bartrack"><div class="barfill ${cls||''}" style="width:${v/max*100}%"></div></div>
      <div class="barval">${f0(v)}</div><div class="barsub">${(v/total*100).toFixed(0)}%</div></div>`;});
  const pairs=keys.map((k,i)=>[labelMap[k]||k,vals[i]]).sort((a,c)=>c[1]-a[1]);
  let ins= pairs[0][1]>0
    ? `最多は <b>${pairs[0][0]}</b>（${f0(pairs[0][1])}${unit}・${(pairs[0][1]/total*100).toFixed(0)}%）、次いで <b>${pairs[1][0]}</b>（${(pairs[1][1]/total*100).toFixed(0)}%）。合計 ${f0(total)}${unit}。`

      <div class="insight">着座あたり獲得率 <b>${seatConv.toFixed(1)}%</b>（獲得${f0(b.成約)}÷着座${f0(b.着座)}）／着座生産性 <b>${fmt(b.着座生産性)}</b>・成約生産性 <b>${fmt(b.成約生産性)}</b>。</div>
    </section>
    <div class="grid2">
      <section><div class="sec-h">${pm==='全期間'?'月別推移 — トータル生産性':pm+' — トータル生産性'}</div><div class="sec-note">${pm==='全期間'?name+'の月ごとのP/稼働':name+'の'+pm+'のP/稼働'}</div>${months.length?trend:'<div class="empty">データなし</div>'}</section>
      <section><div class="sec-h">${pm==='全期間'?'月別推移 — 獲得数':pm+' — 獲得数'}</div><div class="sec-note">${pm==='全期間'?name+'の月ごとの成約台数':name+'の'+pm+'の成約台数'}</div>${months.length?trendGet:'<div class="empty">データなし</div>'}</section>
    </div>
    <section>
      <div class="sec-h">個別項目ごとの生産性（${pm}）</div>
      <div class="sec-note">項目ごとの生産性（合計P÷稼働数）。先頭の「乗り換え計」は端末＋SIMの合算KPI。強み・伸びしろの把握に。</div>
      ${itemBarsHTML(b)}
    </section>
    <div class="grid2">
      <section><div class="sec-h">年齢層別 獲得傾向（${pm}）</div><div class="sec-note">どの年齢層から取れているか</div>${ageD.bars}<div class="insight">${ageD.insight}</div></section>
      <section><div class="sec-h">キャリア別 獲得傾向（${pm}）</div><div class="sec-note">どのキャリアから取れているか</div>${carD.bars}<div class="insight">${carD.insight}</div></section>
    </div>`;
  document.querySelectorAll('[data-pm]').forEach(x=>x.onclick=()=>{view.pmonth=x.dataset.pm;render();});
  document.querySelectorAll('#pcatPills [data-pcat]').forEach(x=>x.onclick=()=>{view.pcat=x.dataset.pcat;render();});
}

/* ---------- nav & routing ---------- */
function buildNav(){
  const el=document.getElementById('plist');
  const q=(document.getElementById('searchBox').value||'').trim();
  el.innerHTML='';
  PEOPLE.filter(n=>!q||n.includes(q)).forEach(n=>{
    const b=document.createElement('button');
    b.className='navbtn'+(view.type==='person'&&view.person===n?' active':'');
    b.innerHTML=`<span class="av">${initials(n)}</span>${n}`;
    b.onclick=()=>openPerson(n);el.appendChild(b);
  });
  document.getElementById('companyBtn').className='navbtn company'+(view.type==='company'?' active':'');
}
function render(scroll){
  buildNav();
  if(view.type==='company')renderCompany();else renderPerson();
  document.getElementById('foot').innerHTML=GEN_INFO;
  if(scroll) window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('companyBtn').onclick=()=>{view.type='company';render(true);};
document.getElementById('searchBox').oninput=buildNav;
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
